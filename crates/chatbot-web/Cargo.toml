[package]
name = "chatbot-web"
version = "0.1.0"
edition = "2021"

[dependencies]
async-trait = "0.1"
async-stream = "0.3"
axum = { version = "0.8", features = ["multipart"] }
bytes = "1"
chatbot-core = { path = "../chatbot-core" }
chatbot-infrastructure = { path = "../chatbot-infrastructure" }
chatbot-protocol = { path = "../chatbot-protocol" }
chrono = { version = "0.4", features = ["serde"] }
futures-util = "0.3"
http = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
tokio = { version = "1", features = ["macros", "rt-multi-thread", "signal", "sync", "time"] }
tokio-util = { version = "0.7", features = ["rt"] }
tower-http = { version = "0.6", features = ["trace"] }
tracing = "0.1"
uuid = { version = "1", features = ["v4"] }

[dev-dependencies]
tower = "0.5"
