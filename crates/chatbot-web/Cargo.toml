[package]
name = "chatbot-web"
version = "0.1.0"
edition = "2021"

[dependencies]
async-trait = { version = "0.1", optional = true }
async-stream = { version = "0.3", optional = true }
axum = { version = "0.8", features = ["multipart"], optional = true }
bytes = { version = "1", optional = true }
chatbot-core = { path = "../chatbot-core", optional = true }
chatbot-infrastructure = { path = "../chatbot-infrastructure", optional = true }
chatbot-protocol = { path = "../chatbot-protocol" }
chrono = { version = "0.4", features = ["serde"], optional = true }
futures-util = { version = "0.3", optional = true }
http = { version = "1", optional = true }
leptos = { version = "0.8.5", default-features = false }
leptos_axum = { version = "0.8.5", optional = true }
leptos_router = { version = "0.8.5", default-features = false }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = { version = "2", optional = true }
tokio = { version = "1", features = ["macros", "rt-multi-thread", "signal", "sync", "time"], optional = true }
tokio-util = { version = "0.7", features = ["rt"], optional = true }
tower-http = { version = "0.6", features = ["trace"], optional = true }
tracing = { version = "0.1", optional = true }
uuid = { version = "1", features = ["v4"], optional = true }
wasm-bindgen = { version = "0.2", optional = true }

[features]
default = ["ssr"]
ssr = [
    "leptos/ssr",
    "leptos_router/ssr",
    "dep:leptos_axum",
    "dep:async-trait",
    "dep:async-stream",
    "dep:axum",
    "dep:bytes",
    "dep:chatbot-core",
    "dep:chatbot-infrastructure",
    "dep:chrono",
    "dep:futures-util",
    "dep:http",
    "dep:thiserror",
    "dep:tokio",
    "dep:tokio-util",
    "dep:tower-http",
    "dep:tracing",
    "dep:uuid",
]
hydrate = ["leptos/hydrate", "dep:wasm-bindgen"]

[[bin]]
name = "chatbot-web"
path = "src/main.rs"
required-features = ["ssr"]

[dev-dependencies]
tower = "0.5"
