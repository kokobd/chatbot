[package]
name = "chatbot-tools"
version = "0.1.0"
edition = "2021"

[dependencies]
chatbot-core = { path = "../crates/chatbot-core" }
chatbot-infrastructure = { path = "../crates/chatbot-infrastructure" }
chrono = { version = "0.4", features = ["serde"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["macros", "rt-multi-thread"] }
thiserror = "2"
zstd = "0.13"

[dev-dependencies]
firestore = "=0.50.0"
rustls = { version = "0.23", default-features = false, features = ["ring"] }
uuid = { version = "1", features = ["v4", "v5"] }
