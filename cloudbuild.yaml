steps:
  # A later build cancels only active builds created before it on this branch.
  # Sorting before selecting candidates keeps an older worker that starts late
  # from ever cancelling a newer build.
  - name: gcr.io/google.com/cloudsdktool/cloud-sdk:slim
    id: cancel-superseded-builds
    entrypoint: bash
    args:
      - -ceu
      - |
        found_current=false
        while IFS= read -r candidate; do
          if [[ "$$candidate" == "$BUILD_ID" ]]; then
            found_current=true
            continue
          fi

          if [[ "$$found_current" == true ]]; then
            # A build can finish after the list request; that race must not
            # prevent the latest build from continuing.
            gcloud builds cancel "$$candidate" \
              --project="$PROJECT_ID" \
              --region="${_LOCATION}" \
              --quiet || true
          fi
        done < <(
          gcloud builds list \
            --project="$PROJECT_ID" \
            --region="${_LOCATION}" \
            --filter="tags='branch-${BRANCH_NAME}' AND (status='QUEUED' OR status='WORKING')" \
            --sort-by='~createTime' \
            --format='value(id)'
        )

  # BuildKit imports and exports every stage in this one build. In particular,
  # the test stage feeds the production build, so Rust is built once for tests
  # and once for the N-API cdylib even when the registry cache is cold.
  - name: gcr.io/cloud-builders/docker
    id: build
    entrypoint: bash
    args:
      - -ceu
      - |
        docker buildx create --use --driver docker-container
        docker buildx inspect --bootstrap
        docker buildx build \
          --progress=plain \
          --target runtime \
          --tag ${_LOCATION}-docker.pkg.dev/$PROJECT_ID/${_REPOSITORY}/service:$COMMIT_SHA \
          --push \
          --cache-from type=registry,ref=${_LOCATION}-docker.pkg.dev/$PROJECT_ID/${_REPOSITORY}/service-cache:buildkit \
          --cache-to type=registry,ref=${_LOCATION}-docker.pkg.dev/$PROJECT_ID/${_REPOSITORY}/service-cache:buildkit,mode=max \
          .

  - name: gcr.io/google.com/cloudsdktool/cloud-sdk:slim
    id: deploy
    waitFor:
      - build
    entrypoint: gcloud
    args:
      - run
      - deploy
      - ${_SERVICE}
      - --project=$PROJECT_ID
      - --region=${_LOCATION}
      - --image=${_LOCATION}-docker.pkg.dev/$PROJECT_ID/${_REPOSITORY}/service:$COMMIT_SHA
      - --quiet

  # This moving tag is added only after Cloud Run accepts the new revision.
  # Artifact Registry keeps the current successful deployment for each stage.
  - name: gcr.io/google.com/cloudsdktool/cloud-sdk:slim
    id: tag-deployed-image
    waitFor:
      - deploy
    entrypoint: gcloud
    args:
      - artifacts
      - docker
      - tags
      - add
      - ${_LOCATION}-docker.pkg.dev/$PROJECT_ID/${_REPOSITORY}/service:$COMMIT_SHA
      - ${_LOCATION}-docker.pkg.dev/$PROJECT_ID/${_REPOSITORY}/service:deployed-${_STAGE}
      - --project=$PROJECT_ID
      - --quiet

substitutions:
  _LOCATION: us-central1
  _REPOSITORY: chatbot
  _SERVICE: chatbot
  _STAGE: main

tags:
  - branch-${BRANCH_NAME}

options:
  defaultLogsBucketBehavior: REGIONAL_USER_OWNED_BUCKET

timeout: 14400s
