name: Rust Browser Check
on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]

jobs:
  test:
    timeout-minutes: 30
    runs-on: ubuntu-latest
    env:
      # These should be the same ones as used in production
      GCS_BUCKET: ${{ secrets.GCS_BUCKET }}
      FIRESTORE_PROJECT_ID: ${{ secrets.FIRESTORE_PROJECT_ID }}
      FIRESTORE_DATABASE_ID: ${{ secrets.FIRESTORE_DATABASE_ID }}

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: stable
      - name: Install wasm target
        run: rustup target add wasm32-unknown-unknown
      - name: Build and test Rust server
        run: cargo test --workspace --all-targets
      - name: Check hydrate client
        run: cargo check -p chatbot-web --target wasm32-unknown-unknown --no-default-features --features hydrate
